{% extends 'base.html' %}

{% block conteudo %}
<h1>Apagar livro</h1>

<p>Tem certeza que deseja apagar "<strong>{{ livro.titulo }}</strong>"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sim, apagar</button>
    <a href="{% url 'lista' %}">Cancelar</a>
</form>
{% endblock %}
